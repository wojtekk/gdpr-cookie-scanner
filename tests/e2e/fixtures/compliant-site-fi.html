<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <title>Vaatimustenmukainen testisivusto</title>
  </head>
  <body>
    <main>
      <h1>Tervetuloa sivustollemme</h1>
    </main>

    <footer id="footer-host"></footer>

    <div
      id="cookie-banner"
      style="
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #1a1a2e;
        color: #fff;
        padding: 20px;
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 16px;
      "
    >
      <p style="flex: 1; margin: 0">
        Käytämme evästeitä analytiikkaan ja muihin <strong>tarkoituksiin</strong> yhteistyössä
        <strong>kumppaneidemme</strong> kanssa. Evästeet säilyvät <strong>13 kuukautta</strong>.
        Voit <strong>muuttaa tai peruuttaa</strong> suostumuksesi milloin tahansa.
        <span id="policy-host"></span>
      </p>
      <button
        id="reject-btn"
        style="
          padding: 10px 20px;
          background: transparent;
          color: #fff;
          border: 1px solid #fff;
          cursor: pointer;
          font-size: 14px;
        "
      >
        Hylkää kaikki
      </button>
      <button
        id="accept-btn"
        style="
          padding: 10px 20px;
          background: #4caf50;
          color: #fff;
          border: none;
          cursor: pointer;
          font-size: 14px;
        "
      >
        Hyväksy kaikki
      </button>
    </div>

    <script>
      document.getElementById("footer-host").attachShadow({ mode: "open" }).innerHTML =
        '<a href="/legal/fi-footer">Tietosuojakäytäntö</a>';
      document.getElementById("policy-host").attachShadow({ mode: "open" }).innerHTML =
        '<a href="/legal/fi-modal" style="color: #90e0ef">Tietosuoja- ja evästekäytäntö</a>';

      document.getElementById("accept-btn").addEventListener("click", function () {
        document.getElementById("cookie-banner").style.display = "none";
        document.cookie = "consent=accepted; path=/; max-age=31536000";
      });

      document.getElementById("reject-btn").addEventListener("click", function () {
        document.getElementById("cookie-banner").style.display = "none";
        document.cookie = "consent=rejected; path=/; max-age=31536000";
      });
    </script>
  </body>
</html>
